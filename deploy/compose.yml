# This service only. csp-infra includes this file to compose the platform.
#
# Every setting is passed from the platform environment (the .env of csp-infra). An unset or empty
# variable is read by the service as "not configured": it applies its documented default, or
# leaves the feature off. No value and no secret is written in this file.
#
# What csp-infra-postgres / the platform provides:
#   APP_AUTH_DATABASE_URL            PostgreSQL URL of the auth schema, login auth_app (never the migration
#                                    executor user). Without it the service starts with the health routes only,
#                                    so it is not required here.
#   APP_AUTH_JWT_PRIVATE_KEY         RS256 signing key (PEM), or ...
#   APP_AUTH_JWT_PRIVATE_KEY_FILE    ... the path of a PEM file that the platform mounts in the container.
#                                    The inline form is meant for development (csp-infra-postgres scripts/dev-keys.sh
#                                    fills it in the git-ignored env/dev.env); qa and main provide the key as a secret
#                                    through APP_AUTH_JWT_PRIVATE_KEY_FILE (Norma 5.9.2).
#                                    Registration needs the database URL and one of the two.
#   APP_AUTH_REDIS_URL               Redis URL, redis://auth_app:<password>@redis:6379/0 (csp-infra-redis, ADR-028). Optional:
#                                    without it the logout route is not enabled and the login is not limited (HU-AUTH-005).
#   APP_AUTH_SMTP_HOST               SMTP relay that delivers the email verification code (ADR-034). Optional: without it
#                                    PATCH /me/email and POST /me/email/verify are not enabled (404).
#   APP_AUTH_SMTP_FROM               Sender address, required when the host is set. APP_AUTH_SMTP_USER and
#                                    APP_AUTH_SMTP_PASSWORD authenticate against the relay (provided as secrets, never versioned).
#   APP_AUTH_SMTP_PORT (587), APP_AUTH_SMTP_TLS (starttls, or none for a local catcher only), APP_AUTH_SMTP_TIMEOUT (5s),
#   APP_AUTH_EMAIL_CHANGE_MAX_CONCURRENCY (4, below APP_AUTH_DATABASE_MAX_CONNECTIONS) and APP_AUTH_EMAIL_CHANGE_QUEUE_TIMEOUT (1s):
#   bulkhead of PATCH /me/email, the extra requests are refused with 429.
#   APP_AUTH_PASSWORD_RESET_URL      Page of the portal that the password reset link opens (ADR-050), an absolute http(s) URL without a
#                                    fragment; the message carries <URL>#token=<token>. Optional: with the SMTP host above it enables
#                                    POST /forgot-password and POST /reset-password, otherwise both answer 404.
#   APP_AUTH_PASSWORD_RESET_MAX_CONCURRENCY (4, below APP_AUTH_DATABASE_MAX_CONNECTIONS) and APP_AUTH_PASSWORD_RESET_QUEUE_TIMEOUT (1s):
#   bulkhead of each of the two routes, the extra requests are refused with 429.
#   Local: `--profile mail up mailpit` with APP_AUTH_SMTP_HOST=mailpit APP_AUTH_SMTP_PORT=1025 APP_AUTH_SMTP_TLS=none
#   APP_AUTH_SMTP_FROM=no-reply@cinesync.local; the messages are read at http://localhost:8025.
# Optional, the service default applies when empty:
#   APP_AUTH_DATABASE_MAX_CONNECTIONS, APP_AUTH_DATABASE_MIN_CONNECTIONS,
#   APP_AUTH_DATABASE_CONNECT_TIMEOUT, APP_AUTH_DATABASE_QUERY_TIMEOUT,
#   APP_AUTH_BCRYPT_ROUNDS, APP_AUTH_BCRYPT_MAX_CONCURRENT (4), APP_AUTH_BCRYPT_QUEUE_TIMEOUT (100ms), APP_AUTH_METRICS_ENABLED (true), APP_AUTH_JWT_EXPIRY (seconds), APP_AUTH_REFRESH_TOKEN_EXPIRY (seconds),
#   APP_AUTH_REFRESH_REUSE_GRACE (seconds), APP_AUTH_REDIS_TIMEOUT, SERVICE_SUBJECTS,
#   APP_AUTH_LOGIN_MAX_ATTEMPTS (10), APP_AUTH_LOGIN_WINDOW (5m), APP_AUTH_LOGIN_LOCK (5m),
#   APP_AUTH_LOGIN_ACCOUNT_SLOW_AFTER (20), APP_AUTH_LOGIN_ACCOUNT_WINDOW (1h), APP_AUTH_LOGIN_ACCOUNT_DELAY (1s),
#   APP_AUTH_LOGIN_LIMIT_TIMEOUT (300ms), APP_AUTH_LOGIN_LIMIT_PAUSE (10s),
#   APP_AUTH_PASSWORD_CHANGE_MAX_ATTEMPTS (5), APP_AUTH_PASSWORD_CHANGE_WINDOW (15m), APP_AUTH_PASSWORD_CHANGE_LOCK (15m),
#   APP_AUTH_PASSWORD_CHANGE_MAX_CONCURRENCY (4, below APP_AUTH_DATABASE_MAX_CONNECTIONS), APP_AUTH_PASSWORD_CHANGE_QUEUE_TIMEOUT (1s),
#   APP_AUTH_HTTP_READ_HEADER_TIMEOUT, APP_AUTH_HTTP_READ_TIMEOUT, APP_AUTH_HTTP_WRITE_TIMEOUT,
#   APP_AUTH_HTTP_IDLE_TIMEOUT, APP_AUTH_HTTP_SHUTDOWN_TIMEOUT, APP_AUTH_HTTP_REQUEST_TIMEOUT (10s), APP_AUTH_DETACHED_DEADLINE (10s),
#   APP_AUTH_HTTP_MAX_HEADER_BYTES (65536), APP_AUTH_MAX_BODY_BYTES (1048576), APP_AUTH_PASSWORD_RESET_MAX_BODY_BYTES (4096),
#   APP_AUTH_REGISTER_MAX_CONCURRENCY and APP_AUTH_LOGIN_MAX_CONCURRENCY (8, below APP_AUTH_DATABASE_MAX_CONNECTIONS).
# The migration executor of csp-auth-db is a tooling service started by hand before the API.
name: csp-auth-api

services:
  auth-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8081"
      # HTTP server limits (Go durations, Norma 5.3.10).
      APP_AUTH_HTTP_READ_HEADER_TIMEOUT: ${APP_AUTH_HTTP_READ_HEADER_TIMEOUT:-}
      APP_AUTH_HTTP_READ_TIMEOUT: ${APP_AUTH_HTTP_READ_TIMEOUT:-}
      APP_AUTH_HTTP_WRITE_TIMEOUT: ${APP_AUTH_HTTP_WRITE_TIMEOUT:-}
      APP_AUTH_HTTP_IDLE_TIMEOUT: ${APP_AUTH_HTTP_IDLE_TIMEOUT:-}
      APP_AUTH_HTTP_SHUTDOWN_TIMEOUT: ${APP_AUTH_HTTP_SHUTDOWN_TIMEOUT:-}
      APP_AUTH_HTTP_REQUEST_TIMEOUT: ${APP_AUTH_HTTP_REQUEST_TIMEOUT:-}
      APP_AUTH_DETACHED_DEADLINE: ${APP_AUTH_DETACHED_DEADLINE:-}
      APP_AUTH_HTTP_MAX_HEADER_BYTES: ${APP_AUTH_HTTP_MAX_HEADER_BYTES:-}
      APP_AUTH_MAX_BODY_BYTES: ${APP_AUTH_MAX_BODY_BYTES:-}
      APP_AUTH_PASSWORD_RESET_MAX_BODY_BYTES: ${APP_AUTH_PASSWORD_RESET_MAX_BODY_BYTES:-}
      APP_AUTH_REGISTER_MAX_CONCURRENCY: ${APP_AUTH_REGISTER_MAX_CONCURRENCY:-}
      APP_AUTH_LOGIN_MAX_CONCURRENCY: ${APP_AUTH_LOGIN_MAX_CONCURRENCY:-}
      # Database of this domain (Annex J) and its pool.
      APP_AUTH_DATABASE_URL: ${APP_AUTH_DATABASE_URL:-}
      APP_AUTH_DATABASE_MAX_CONNECTIONS: ${APP_AUTH_DATABASE_MAX_CONNECTIONS:-}
      APP_AUTH_DATABASE_MIN_CONNECTIONS: ${APP_AUTH_DATABASE_MIN_CONNECTIONS:-}
      APP_AUTH_DATABASE_CONNECT_TIMEOUT: ${APP_AUTH_DATABASE_CONNECT_TIMEOUT:-}
      APP_AUTH_DATABASE_QUERY_TIMEOUT: ${APP_AUTH_DATABASE_QUERY_TIMEOUT:-}
      # Redis of the auth state (ADR-028): the revoked jti list. The URL carries the auth_app user of csp-infra-redis.
      # Without it the logout route is off. The timeout is a Go duration that bounds connect, read and write.
      APP_AUTH_REDIS_URL: ${APP_AUTH_REDIS_URL:-}
      APP_AUTH_REDIS_TIMEOUT: ${APP_AUTH_REDIS_TIMEOUT:-}
      # Login attempt limit (HU-AUTH-005, ADR-040), only with Redis: failures inside the window that lock a client address, and the lock time.
      APP_AUTH_LOGIN_MAX_ATTEMPTS: ${APP_AUTH_LOGIN_MAX_ATTEMPTS:-}
      APP_AUTH_LOGIN_WINDOW: ${APP_AUTH_LOGIN_WINDOW:-}
      APP_AUTH_LOGIN_LOCK: ${APP_AUTH_LOGIN_LOCK:-}
      # Slowdown per account (HU-AUTH-005, ADR-059), only with Redis: failures of one email that start to delay the answer, the window, the delay.
      APP_AUTH_LOGIN_ACCOUNT_SLOW_AFTER: ${APP_AUTH_LOGIN_ACCOUNT_SLOW_AFTER:-}
      APP_AUTH_LOGIN_ACCOUNT_WINDOW: ${APP_AUTH_LOGIN_ACCOUNT_WINDOW:-}
      APP_AUTH_LOGIN_ACCOUNT_DELAY: ${APP_AUTH_LOGIN_ACCOUNT_DELAY:-}
      # Bound of the limiter against Redis (ADR-048): the most one call waits, and the pause after a failure.
      APP_AUTH_LOGIN_LIMIT_TIMEOUT: ${APP_AUTH_LOGIN_LIMIT_TIMEOUT:-}
      APP_AUTH_LOGIN_LIMIT_PAUSE: ${APP_AUTH_LOGIN_LIMIT_PAUSE:-}
      # Change of the own password (HU-AUTH-007, ADR-051): wrong current passwords per user inside the window that lock the change, the
      # lock time, and the bulkhead of POST /me/password.
      APP_AUTH_PASSWORD_CHANGE_MAX_ATTEMPTS: ${APP_AUTH_PASSWORD_CHANGE_MAX_ATTEMPTS:-}
      APP_AUTH_PASSWORD_CHANGE_WINDOW: ${APP_AUTH_PASSWORD_CHANGE_WINDOW:-}
      APP_AUTH_PASSWORD_CHANGE_LOCK: ${APP_AUTH_PASSWORD_CHANGE_LOCK:-}
      APP_AUTH_PASSWORD_CHANGE_MAX_CONCURRENCY: ${APP_AUTH_PASSWORD_CHANGE_MAX_CONCURRENCY:-}
      APP_AUTH_PASSWORD_CHANGE_QUEUE_TIMEOUT: ${APP_AUTH_PASSWORD_CHANGE_QUEUE_TIMEOUT:-}
      # SMTP relay of the email verification code (ADR-034). Without a host the email change routes are off.
      APP_AUTH_SMTP_HOST: ${APP_AUTH_SMTP_HOST:-}
      APP_AUTH_SMTP_PORT: ${APP_AUTH_SMTP_PORT:-}
      APP_AUTH_SMTP_USER: ${APP_AUTH_SMTP_USER:-}
      APP_AUTH_SMTP_PASSWORD: ${APP_AUTH_SMTP_PASSWORD:-}
      APP_AUTH_SMTP_FROM: ${APP_AUTH_SMTP_FROM:-}
      APP_AUTH_SMTP_TLS: ${APP_AUTH_SMTP_TLS:-}
      APP_AUTH_SMTP_TIMEOUT: ${APP_AUTH_SMTP_TIMEOUT:-}
      APP_AUTH_EMAIL_CHANGE_MAX_CONCURRENCY: ${APP_AUTH_EMAIL_CHANGE_MAX_CONCURRENCY:-}
      APP_AUTH_EMAIL_CHANGE_QUEUE_TIMEOUT: ${APP_AUTH_EMAIL_CHANGE_QUEUE_TIMEOUT:-}
      # Password reset (ADR-050): the page of the portal behind the link of the message, and the bulkhead of its two routes.
      APP_AUTH_PASSWORD_RESET_URL: ${APP_AUTH_PASSWORD_RESET_URL:-}
      APP_AUTH_PASSWORD_RESET_MAX_CONCURRENCY: ${APP_AUTH_PASSWORD_RESET_MAX_CONCURRENCY:-}
      APP_AUTH_PASSWORD_RESET_QUEUE_TIMEOUT: ${APP_AUTH_PASSWORD_RESET_QUEUE_TIMEOUT:-}
      # Password hashing cost.
      APP_AUTH_BCRYPT_ROUNDS: ${APP_AUTH_BCRYPT_ROUNDS:-}
      # Bound on the concurrent password hashes of every route (ADR-060): the slots and the longest wait for one before the 503.
      APP_AUTH_BCRYPT_MAX_CONCURRENT: ${APP_AUTH_BCRYPT_MAX_CONCURRENT:-}
      APP_AUTH_BCRYPT_QUEUE_TIMEOUT: ${APP_AUTH_BCRYPT_QUEUE_TIMEOUT:-}
      # GET /metrics for Prometheus (ADR-061); not routed by the gateway.
      APP_AUTH_METRICS_ENABLED: ${APP_AUTH_METRICS_ENABLED:-}
      # Signing key of the tokens (Norma 5.3.7); csp-infra mounts the PEM file when the file form is used.
      APP_AUTH_JWT_PRIVATE_KEY: ${APP_AUTH_JWT_PRIVATE_KEY:-}
      APP_AUTH_JWT_PRIVATE_KEY_FILE: ${APP_AUTH_JWT_PRIVATE_KEY_FILE:-}
      # Token lifetimes in integer seconds.
      APP_AUTH_JWT_EXPIRY: ${APP_AUTH_JWT_EXPIRY:-}
      APP_AUTH_REFRESH_TOKEN_EXPIRY: ${APP_AUTH_REFRESH_TOKEN_EXPIRY:-}
      # Grace window of the refresh token reuse detection, in integer seconds (ADR-029).
      APP_AUTH_REFRESH_REUSE_GRACE: ${APP_AUTH_REFRESH_REUSE_GRACE:-}
      # Subjects of the services allowed to call the internal operations (ADR-020), comma-separated.
      SERVICE_SUBJECTS: ${SERVICE_SUBJECTS:-}
    # The service exits when PostgreSQL does not answer at start (first `up`, instance still starting): retry until it does.
    # No depends_on: the database service belongs to csp-infra-postgres, not to this file.
    restart: on-failure
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8081"]
    networks: [platform]

  # Local mail catcher, only for development (profile `mail`). Never use it outside a developer machine.
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: [mail]
    # SMTP on 1025 (the service reaches it on the platform network) and the web UI on 8025, both published on the loopback only.
    expose: ["1025"]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    networks: [platform]

  # The same catcher, but it also relays each message it receives to a real SMTP provider (profile `mail-relay`, development only,
  # instead of `mail`: both use the same ports). The service keeps pointing at `mailpit:1025` and never talks to the provider, so the
  # messages are shown at http://localhost:8025 and an expired key (the provider answers with an error) only makes the relay fail,
  # which Mailpit logs. The relay runs inside the SMTP session of Mailpit: a provider that is unreachable or slow keeps the sender
  # waiting (about 20 s when it is unreachable) and the synchronous email change of the service answers 500 when its timeout
  # (APP_AUTH_SMTP_TIMEOUT, 5 s by default, 15 s advised here) or the request deadline (10 s) expires, although Mailpit stores the
  # message afterwards. The password reset is queued and is not affected. If the provider is down, use the profile `mail` instead.
  # To change provider or renew the key, change the MAILPIT_RELAY_* variables of the platform env file and run
  # csp-infra-postgres/scripts/mailpit-relay.sh again.
  # Only the recipients that match MAILPIT_RELAY_MATCHING (a regular expression) are relayed, so test addresses are not sent to the provider.
  mailpit-relay:
    image: axllent/mailpit:v1.21.8
    profiles: [mail-relay]
    command: ["--smtp-relay-config=/etc/mailpit/relay.yml"]
    environment:
      # Empty relays nothing (the messages are only stored); no default on purpose, so that nothing reaches the provider by accident.
      MP_SMTP_RELAY_MATCHING: ${MAILPIT_RELAY_MATCHING:-}
    volumes:
      # Compose reads every service of the file, started or not, so the variables have defaults and the platform does not need them.
      # csp-infra-postgres/scripts/mailpit-relay.sh renders the real file and sets MAILPIT_RELAY_FILE.
      - ${MAILPIT_RELAY_FILE:-./mailpit-relay.example.yml}:/etc/mailpit/relay.yml:ro
    expose: ["1025"]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    networks:
      platform:
        aliases: [mailpit]

networks:
  platform:
    name: platform
    external: true
