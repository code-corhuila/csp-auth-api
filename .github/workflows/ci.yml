name: CI

# Every Pull Request builds the repository and runs its tests on a clean machine.
# "It works on my computer" is not evidence; a green check here is.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The contract tests validate the responses against the approved contract; the job fails if it is missing.
      AUTH_CONTRACT_FILE: ${{ github.workspace }}/csp-docs/07-api/contracts/openapi/auth-service.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/csp-docs
          ref: main
          path: csp-docs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  integration-tests:
    # The PostgreSQL adapters run against the real schema: the migrations of csp-auth-db
    # (develop) are applied to an empty database, the same way its own db-ci.yml does.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csp
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d csp"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/csp-auth-db
          ref: develop
          path: csp-auth-db
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply the csp-auth-db migrations
        run: |
          # csp-infra-postgres creates the login users before any executor runs (Annex J.5.5).
          psql -v ON_ERROR_STOP=1 -h localhost -U ci_admin -d csp \
            -c "CREATE ROLE auth_app LOGIN PASSWORD 'ci-only'; CREATE ROLE worker_app LOGIN PASSWORD 'ci-only';"
          docker run --rm --network host -v "$PWD/csp-auth-db:/workspace:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/csp \
            -e FLYWAY_USER=ci_admin -e FLYWAY_PASSWORD=ci-only \
            flyway/flyway:11.20 -workingDirectory=/workspace -configFiles=flyway.toml migrate
      - name: Create the auth_app user of Redis
        run: |
          # Same ACL as csp-infra-redis (ADR-028): only the commands and key patterns of the auth state.
          docker run --rm --network host redis:7-alpine redis-cli ACL SETUSER auth_app on '>ci-only' '~attempts:*' '~locked:*' '~blacklist:*' -@all +get +set +exists +incr +expire +ttl +del +ping
      - name: Integration tests
        env:
          AUTH_TEST_REDIS_URL: redis://auth_app:ci-only@localhost:6379/0
          AUTH_TEST_DATABASE_URL: postgres://auth_app:ci-only@localhost:5432/csp
          AUTH_TEST_OUTBOX_READER_URL: postgres://worker_app:ci-only@localhost:5432/csp
        run: go test -tags integration ./...
